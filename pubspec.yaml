name: app_boxe
description: "Timer de rounds de boxe."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0
  flutter_foreground_task: ^8.15.3
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/bell.wav
    - assets/sounds/warning.wav
    - assets/sounds/som_inicio_round.mp3
    - assets/sounds/10seconds.mp3
